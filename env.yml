name: clam_latest
dependencies:
    - python==3.10
    - pip
    - pip:
        # torch/torchvision CUDA 11.8 build, as installed on the cluster
        - --extra-index-url https://download.pytorch.org/whl/cu118
        - torch==2.5.1+cu118
        - torchvision==0.20.1+cu118
        # timm >= 1.0 is required by UNI2-h (reg_tokens, SwiGLUPacked)
        - timm==1.0.28
        - numpy==2.4.4
        - pandas==3.0.5
        - scipy==1.17.1
        - scikit-learn==1.9.0
        - matplotlib==3.11.1
        - h5py==3.16.0
        - PyYAML==6.0.3
        - tqdm==4.70.0
        - opencv-python==5.0.0.93
        # openslide-bin ships the OpenSlide C library, so no conda-forge::openslide needed
        - openslide-bin==4.0.1.2
        - openslide-python==1.4.6
        # UNI / UNI2-h checkpoint download and loading
        - huggingface_hub==1.28.0
        - safetensors==0.8.0
        # Macenko stain normalization (--stain_norm_target)
        - torchstain==1.4.1
        # smooth-topk, for --bag_loss svm / --inst_loss svm
        - git+https://github.com/oval-group/smooth-topk.git
        - tensorboardX==2.6.5
        # required only by --model_type transmil; NOT yet installed on the cluster
        - nystrom-attention
